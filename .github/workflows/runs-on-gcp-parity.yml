name: runs-on-gcp parity test

on:
  push:
    branches:
      - runs-on-gcp-parity-20260501
  workflow_dispatch:

jobs:
  parity-array:
    runs-on:
      - self-hosted
      - runs-on=${{ github.run_id }}
      - runner=parity-array
      - spot=false
      - extras=s3-cache+ecr-cache+tmpfs+otel
      - metrics=cpu+memory+disk
    steps:
      - name: Show runner
        run: |
          echo "runner=${RUNNER_NAME}"
          uname -a
          df -h
      - name: Verify config env
        run: |
          env | sort | grep -E 'RUNS_ON_GCP|RUNS_ON_GCS|OTEL' || true
          test "${RUNS_ON_GCP_CACHE_STRATEGY}" = "gcs"
          test "${RUNS_ON_GCS_CACHE_BUCKET}" = "runs-on-gcp-parity-cache-placeholder"
          test "${RUNS_ON_GCP_OBSERVABILITY}" = "enabled"
          test "${RUNS_ON_GCP_METRICS}" = "cpu,memory,disk"
          test "${RUNS_ON_GCP_LOG_LEVEL}" = "debug"
